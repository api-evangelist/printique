actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists on Printique - and no documented public
    API of any kind exists. No AsyncAPI document was created because there is no
    Printique-owned server-push transport to model. The apis.yml catalogs three
    conceptual, integration-delivered surfaces (Product Catalog, Orders and
    Fulfillment, Order Status and Shipping) with endpointsModeled true, since
    Printique publishes no developer portal, base URL, paths, or schemas on the
    open web.
