    type: Documentation
    note: PhotoShelter wholesale print-and-product integration with Printique; wholesale costs billed monthly. Platform-mediated, not a Printique public API. (Returned HTTP 403 to automated fetch; summarized from search index.)
  - url: https://www.printique.com/prints/
    type: WebPage
    note: Product catalog - photo prints, fine-art giclee, wall decor, books, albums, cards, calendars, gifts. Sizes and finishes listed for consumers, not exposed as an API.
  - url: https://www.printique.com/blog/adoramapix-is-now-printique/
